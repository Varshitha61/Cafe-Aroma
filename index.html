<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Aroma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Outfit:wght@100;300;400;700;900&display=swap"
    rel="stylesheet">


  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coffee: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              200: '#eaddd7',
              300: '#e0cec7',
              400: '#d2bab0',
              500: '#a1887f', // Material Brown 300
              600: '#8d6e63',
              700: '#795548', // Primary Coffee
              800: '#5d4037', // Deep Roast
              900: '#3e2723', // Espresso
            },
            amber: {
              50: '#fff8e1',
              100: '#ffecb3',
              200: '#ffe082',
              300: '#ffd54f',
              400: '#ffca28',
              500: '#ffc107',
              600: '#ffb300', // Rich Gold
              700: '#ffa000',
              800: '#ff8f00',
              900: '#ff6f00', // Burnt styling
            },
            cream: '#f5f5dc',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
